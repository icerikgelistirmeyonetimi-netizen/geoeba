<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>Manrope genişlik ölçümü</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap">
</head>
<body>
<script>
/*
 * src/math/manropeTablosu.ts'yi üreten ölçüm sayfası. scripts/manrope-genislik.cjs bu sayfayı
 * Playwright + msedge ile açar ve window.hazir sonucunu okur. Uygulamanın yazı yığınıyla ÖLÇÜLÜR.
 *
 * Kritik: document.fonts.load(font, metin) çağrısına bütün karakterler verilmelidir. Metin verilmezse
 * yalnızca temel Latin alt kümesi indirilir ve ş / ğ / İ / ı yanlış (yedek yazı tipinden) ölçülür.
 */
const HARFLER = (() => {
  const a = [];
  for (let c = 32; c < 127; c++) a.push(String.fromCharCode(c));
  for (const c of 'ÇĞİÖŞÜçğıöşüÂâÎîÛû°²³≈π′″−·×∠△⊥∥≅∼αβγθ½₀₁₂₃₄₅₆₇₈₉⌢…∣≠≤≥') a.push(c);
  return a;
})();
window.hazir = (async () => {
  const hepsi = HARFLER.join('');
  for (const w of [600, 700]) await document.fonts.load(`${w} 100px Manrope`, hepsi);
  await document.fonts.ready;
  const ctx = document.createElement('canvas').getContext('2d');
  const out = { genislik: {}, kern: {}, yuklu: {} };
  const KERN = [...'ABCDEFGHIJKLMNOPQRSTUVWXYZÇĞİÖŞÜabcdefghijklmnopqrstuvwxyzçğıöşü0123456789()[],;.=°²³′\'-−+·≈π/ '];
  const YIGIN = "Manrope, 'Instrument Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif";
  out.eksik = HARFLER.filter((c) => {
    ctx.font = '700 100px Manrope, monospace';
    const a = ctx.measureText(c).width;
    ctx.font = '700 100px Manrope, serif';
    return Math.abs(a - ctx.measureText(c).width) > 0.01;
  }).join('');
  for (const [ad, font] of [['w700', '700 1000px ' + YIGIN], ['w600', '600 1000px ' + YIGIN]]) {
    ctx.font = font;
    const w = {};
    for (const c of HARFLER) w[c] = Math.round(ctx.measureText(c).width);
    out.genislik[ad] = w;
    const k = {};
    for (const a of KERN) for (const b of KERN) {
      const d = Math.round(ctx.measureText(a + b).width - ctx.measureText(a).width - ctx.measureText(b).width);
      if (Math.abs(d) >= 8) k[a + b] = d;
    }
    out.kern[ad] = k;
    out.yuklu[ad] = document.fonts.check(font.slice(0, 3) + ' 20px Manrope', 'şğİı');
  }
  ctx.font = '700 1000px ' + YIGIN;
  out.ornek = ['kiriş |AB|', 'A(ABC) = 12 br²', 'Ç(ABC) ≈ 24 br', 'Yay uzunluğu ≈ 7,12 br', 'Eğim', 'AOB dilimi', 'İŞĞ ığş']
    .map((s) => [s, Math.round(ctx.measureText(s).width)]);
  return out;
})();
</script>
</body>
</html>
